services:
  postgres:
    image: postgres:16-alpine
    container_name: textgen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: textgen_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d textgen_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: textgen_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  user-service:
    build:
      context: ./user_service
    container_name: textgen_user_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres_password@postgres:5432/textgen_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SECRET_KEY: change-this-secret-key-in-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nn-service:
    build:
      context: ./nn_service
    container_name: textgen_nn_service
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    volumes:
      - ./nn_service/model_weights:/app/model_weights
      - hf_cache:/root/.cache/huggingface
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: textgen_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - user-service

volumes:
  postgres_data:
  rabbitmq_data:
  hf_cache:
